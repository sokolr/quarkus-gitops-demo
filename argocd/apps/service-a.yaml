apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sokolr/quarkus-gitops-demo.git
    targetRevision: main
    path: k8s/overlays/local/service-a
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      name: service-a
      jqPathExpressions:
        - .spec.http[].route[].weight
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
