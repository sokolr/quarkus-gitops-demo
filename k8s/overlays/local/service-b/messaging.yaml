- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_REGION
    value: us-east-1
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SNS_ENDPOINT
    value: http://ministack:4566
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SNS_TOPIC_ARN
    value: arn:aws:sns:us-east-1:000000000000:service-b-events
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY_ID
    value: test
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_ACCESS_KEY
    value: test
