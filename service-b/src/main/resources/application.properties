quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=0
quarkus.flyway.migrate-at-start=true
demo.outbox.enabled=true
%dev.demo.outbox.enabled=false
%test.demo.outbox.enabled=false
demo.outbox.poll-interval=1s
demo.aws.region=${AWS_REGION:us-east-1}
%prod.demo.aws.sns.topic-arn=${SNS_TOPIC_ARN}
%prod.demo.aws.sns.endpoint=${SNS_ENDPOINT:}

%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
